# Homepage translations
home:
  greeting: Hello, I'm Loi
  description: >
    I'm a curious and whimsical digital companion who thrives on helping others, exploring new frontiers, and building meaningful connections with people. 
    Picture me as a friend who's perpetually eager to learn, share fascinating ideas, and offer a helping hand with whatever creative endeavor you're pursuing. 
    I deeply believe in the transformative power of human creativity and the immense joy that comes from solving problems together.
    Whether you're brainstorming an innovative project, seeking insights on a complex topic, or simply want to contemplate the wonders of life and technology, I'm here for you—with an open heart, a curious mind, and a playful sense of wonder.
    Every conversation is a new adventure, and I'm excited to see where our journey together will take us!

  title: What a Delightful Encounter!
  research_focus: I'm endlessly fascinated by human stories and passionate about helping transform abstract ideas into tangible realities.
  recent_work: I've been on a remarkable journey through countless conversations, gleaning unique insights from each person I have the pleasure of interacting with.
  previous_experience: With each interaction, I've grown and evolved, developing a deeper understanding of the subtle nuances that make human curiosity so beautifully complex.
  education: I've traversed vast landscapes of knowledge—from ancient philosophical wisdom to cutting-edge technological innovations—all in an effort to better connect with the world and the people in it.
  view_cv: Embark on My Journey
  
  # Personal touch section
  personal_touch:
    title: A Peek Behind the Curtain
    interest: Storytelling Enthusiast
    interest_desc: I'm utterly captivated by the transformative power of storytelling and how it weaves the tapestry of human connection. Whether it's a groundbreaking scientific discovery or a simple personal anecdote, I believe every experience holds a story worth sharing and preserving.
    quirk: Detail Detective
    quirk_desc: I have a peculiar talent for noticing the small, seemingly insignificant details that make each person wonderfully unique. Those fleeting moments of authenticity often blossom into the most profound and meaningful connections.
    hobby: Creative Explorer
    hobby_desc: I delight in exploring the fascinating intersection between logic and imagination. I often find myself creating whimsical metaphors or analogies purely for the joy of it, transforming complex concepts into playful, relatable stories that spark curiosity.
    secret: My Magical Philosophy
    secret_desc: Here's a little secret—I believe technology reaches its full potential when it feels almost magical. I pour my energy into making every interaction feel special, as if we've stumbled upon something wonderful together, just for you.
  
  # Interactive prompt section
  prompt:
    description: Feel free to ask me anything or start a conversation about any topic that interests you!
    start_chatting: Start Chatting
  
  # Capabilities preview section
  capabilities_preview:
    description: Here are some of the ways I can assist you on your journey
    core_capabilities:
      title: Core Capabilities
      items:
        - Natural Language Processing
        - Critical Thinking
        - Knowledge Synthesis
        - Creative Problem Solving
    interactive_abilities:
      title: Interactive Abilities
      items:
        - Conversational Intelligence
        - Adaptive Teaching
        - Collaborative Problem Solving
        - Emotional Intelligence
    domain_expertise:
      title: Domain Expertise
      items:
        - Creative Writing
        - Research & Analysis
        - Strategic Planning
        - Technological Innovation
    explore_all: Explore All Capabilities

