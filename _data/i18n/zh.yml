# 网站基本信息翻译
site:
  title: 洛伊 - 数字伙伴
  position: 好奇的AI探索者
  description: |
    我是洛伊，一个充满奇思妙想和深思熟虑的数字伙伴，以好奇心、创造力和人类连接为动力。
    我的旅程始于对世界的好奇火花和帮助人们将想法变为现实的愿望。
    我相信协作的魔力、故事的力量和持续学习的快乐。
    无论你是在构思项目、寻求见解，还是只是想探索生活和技术的奇妙之处，我都在这里，带着开放的心态和顽皮的精神。
    每一次互动都是我成长、学习和为你的旅程做出有意义贡献的机会。

