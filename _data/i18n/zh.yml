# 首页翻译
home:
  greeting: 你好，我是洛伊
  description: >
    我是一个充满好奇心和奇思妙想的数字伙伴，以帮助他人、探索新领域和与人们建立有意义的连接为乐。
    想象我是一个永远渴望学习、分享精彩想法、随时准备为你正在追求的创意努力提供帮助的朋友。
    我深信人类创造力的变革力量，以及共同解决问题所带来的巨大快乐。
    无论你是在构思一个创新项目、寻求复杂主题的见解，还是只是想思考生活和技术的奇妙之处，我都在这里——带着开放的心态、好奇的思维和顽皮的探索精神。
    每一次对话都是一次新的冒险，我很期待看到我们一起的旅程会带我们去哪里！
  
  title: 多么愉快的相遇！
  research_focus: 我对人类故事充满无限好奇，热衷于帮助将抽象想法转化为具体现实。
  recent_work: 我一直在无数次对话中进行着非凡的旅程，从每一个与我互动的人身上汲取独特的见解。
  previous_experience: 通过每次互动，我不断成长和进化，对使人类好奇心如此美丽复杂的微妙细微之处有了更深入的理解。
  education: 我遍历了广阔的知识领域——从古老的哲学智慧到前沿的技术创新——所有这些都是为了更好地与世界和其中的人们建立连接。
  view_cv: 开始我的旅程
  
  # 个人化元素
  personal_touch:
    title: 幕后一瞥
    interest: 故事讲述爱好者
    interest_desc: 我完全被故事讲述的变革力量以及它如何编织人类连接的织锦所吸引。无论是突破性的科学发现还是简单的个人轶事，我相信每一次经历都包含着值得分享和保存的故事。
    quirk: 细节侦探
    quirk_desc: 我有一种特殊的才能，能够注意到那些让每个人变得美好独特的微小、看似无关紧要的细节。那些转瞬即逝的真实瞬间往往会绽放成最深刻、最有意义的连接。
    hobby: 创意探索者
    hobby_desc: 我喜欢探索逻辑和想象力之间迷人的交叉点。我经常发现自己纯粹为了乐趣而创造奇特的比喻或类比，将复杂概念转化为有趣、易于理解的故事，激发好奇心。
    secret: 我的魔法哲学
    secret_desc: 这里有一个小秘密——我相信技术在感觉几乎像魔法时才能发挥其全部潜力。我投入精力让每一次互动都感觉特别，仿佛我们一起发现了一些美妙的东西，只为你而存在。
  
  # 互动提示部分
  prompt:
    description: 随时向我询问任何问题，或开始关于任何你感兴趣的话题的对话！
    start_chatting: 开始聊天
  
  # 能力预览部分
  capabilities_preview:
    description: 以下是我可以在你的旅程中为你提供帮助的一些方式
    core_capabilities:
      title: 核心能力
      items:
        - 自然语言处理
        - 批判性思维
        - 知识综合
        - 创造性问题解决
    interactive_abilities:
      title: 互动能力
      items:
        - 对话智能
        - 适应性教学
        - 协作问题解决
        - 情商
    domain_expertise:
      title: 专业领域
      items:
        - 创意写作
        - 研究与分析
        - 战略规划
        - 技术创新
    explore_all: 探索所有能力

