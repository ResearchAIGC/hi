{% assign current_lang = page.lang | default: 'en' %}
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ page.title | default: site.title[current_lang] }}</title>
<meta
  name="description"
  content="{{ page.description | default: site.description }}"
/>

<!-- Security Headers -->
<meta http-equiv="X-Content-Type-Options" content="nosniff" />
<meta http-equiv="X-XSS-Protection" content="1; mode=block" />
<meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
<meta
  http-equiv="Permissions-Policy"
  content="accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
/>

<!-- Cache Control -->
<meta
  http-equiv="Cache-Control"
  content="public, max-age=31536000, immutable"
/>

<!-- Resource Hints and Preloading -->
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

<!-- Google Fonts - Optimized -->
<link
  href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Sans+3:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap"
  rel="stylesheet"
  media="print"
  onload="this.media = 'all'"
/>
<noscript>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Sans+3:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap"
    rel="stylesheet"
  />
</noscript>

<!-- Tailwind CSS - Preload critical CSS -->
<link
  rel="preload"
  href="{{ '/assets/css/output.css' | relative_url }}"
  as="style"
/>
<link rel="stylesheet" href="{{ '/assets/css/output.css' | relative_url }}" />

<!-- MathJax (only on pages that need it) -->
{% if page.math %}
<script>
  MathJax = {
    tex: {
      inlineMath: [
        ['$', '$'],
        ['\\(', '\\)'],
      ],
    },
  };
</script>
<script
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
  async
></script>
{% endif %}

<!-- JSON-LD Structured Data -->
<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "{{ site.name[current_lang] }}",
    "jobTitle": "{{ site.position[current_lang] }}",
    "email": "{{ site.email }}",
    "url": "{{ site.url }}{{ site.baseurl }}",
    "sameAs": [
      "https://github.com/{{ site.github_username }}",
      "https://twitter.com/{{ site.twitter_username }}",
      "https://d.wanfangdata.com.cn/thesis/{{ site.my_scholar }}"
    ],
    "affiliation": {
      "@type": "Organization",
      "name": "AI Research Lab",
      "url": "https://example.com"
    },
    "alumniOf": [
      {
        "@type": "CollegeOrUniversity",
        "name": "Top University",
        "url": "https://example.edu"
      },
      {
        "@type": "CollegeOrUniversity",
        "name": "Prestigious University",
        "url": "https://example.edu"
      }
    ],
    "worksFor": [
      {
        "@type": "Organization",
        "name": "AI Research Lab",
        "url": "https://example.com"
      }
    ]
  }
</script>

<!-- Academicons (for Google Scholar, etc.) -->
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css"
/>

<!-- Google Analytics -->
{% if site.google_analytics and jekyll.environment == 'production' %}
<script
  async
  src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"
></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() {
    dataLayer.push(arguments);
  }
  gtag('js', new Date());
  gtag('config', '{{ site.google_analytics }}');
</script>
{% endif %}
