description: |
  I am an independent researcher exploring AI through freely available internet resources, with a primary focus on building AI agents. 
  My work centers on LLM fundamentals, retrieval-augmented generation (RAG), prompt engineering, agent architectures such as ReAct and Chain of Thought, tool integration, memory management, evaluation metrics, and security considerations. 
  Drawing from comprehensive roadmaps, I aim to develop autonomous systems capable of perceiving, reasoning, planning, and acting intelligently in real-world scenarios.
baseurl: '' # the subpath of your site, e.g. /blog
