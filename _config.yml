# Build settings
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Blog settings
permalink: /blog/:year/:month/:day/:title/
excerpt_separator: <!--more-->

defaults:
  - scope:
      path: '_posts'
      type: 'posts'
    values:
      layout: 'post'
      math: false

# Build settings
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/