<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
  <head>
    {% include head.html %}
  </head>
  <body class="bg-surface text-text font-serif antialiased print:bg-white">
    <div class="print:hidden">{% include header.html %}</div>
    <main class="max-w-4xl mx-auto px-6 py-8 print:py-4 print:px-4">
      {{ content }}
    </main>
    <div class="print:hidden">{% include footer.html %}</div>

    <!-- i18n data and script -->
    <script>
      // Embed i18n translations
      window.i18n = {{ site.data.i18n | jsonify }};
    </script>
    <script src="{{ '/assets/js/i18n.js' | relative_url }}" defer></script>
  </body>
</html>
